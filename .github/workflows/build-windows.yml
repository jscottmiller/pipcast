name: Build Windows

# Builds the standalone portable .exe on a real Windows runner so ffmpeg-static
# fetches the Windows binary. Run on demand, or on a v* tag to cut a release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Portable exe
    runs-on: windows-latest
    permissions:
      contents: write # required for the release upload on tags

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:win
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: pipcast-windows-portable
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
